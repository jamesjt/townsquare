<!-- FT-1317: the seat mark, take three. ui-seat.png is a SIDE-view chair —
     back post on the left, seat running right — and at claim size (28px)
     its post + slab + legs collapse into a letter H (user report). This is
     the same chair seen from the FRONT. First cut had a windowed backrest
     (two posts + top rail) and the render read as a letter A — a window in
     a small mark is a letterform generator. So the backrest is a SOLID
     panel, the seat slab overhangs it on both sides, and the two front
     legs are SPLAYED a few degrees — the splay is what furniture has and
     letters never do. Symmetric on purpose: the FT-1271 face-the-clock
     flip becomes a no-op on this art, and the chair-right class keeps only
     its corner-picking job.
     Built from overlapping primitives in the fork's own painted-primitive
     idiom (see ui-nominate-hand.svg's header), single bone tone #cfc4ae
     carried in-file, same swappable-art pattern: replace this file and
     every chair mark wears the new art with zero code. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 440">
  <g fill="#cfc4ae">
    <!-- backrest: one solid panel, no window -->
    <rect x="84" y="16" width="192" height="196" rx="46"/>
    <!-- seat slab: overhangs the backrest on both sides -->
    <rect x="28" y="196" width="304" height="74" rx="32"/>
    <!-- front legs, splayed outward under the slab's corners -->
    <rect x="58" y="248" width="58" height="176" rx="26"
          transform="rotate(-7 87 260)"/>
    <rect x="244" y="248" width="58" height="176" rx="26"
          transform="rotate(7 273 260)"/>
  </g>
</svg>
