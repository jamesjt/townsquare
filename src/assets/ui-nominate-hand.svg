<!-- FT-1069c rider: the nominate mark tries again. The user's read on the
     first cut (a manicule: fist, cuff, upright thumb): "don't love this,
     make something closer to this" — with a reference of a hand seen from
     the BACK, one long index leading a horizontal point, the other three
     fingers folded UNDER in a smooth receding knuckle curve, and the thumb
     lying LOW and tucked along that fold, not standing up. The whole gesture
     reads flat and elongated, not a tall fist with a finger stuck on.
     Rebuilt to that character, same pointing-right direction as before, from
     overlapping primitives (the noose's own idiom): a two-segment tapered
     capsule for the index (thick at the root, narrowing to the tip — the
     "elegant" proportion the manicule lacked), three shrinking circles
     for the folded knuckles peeking below it, a low rotated capsule for the
     tucked thumb, and a palm/cuff pair anchoring it all to the wrist. If the
     knuckle curve mushes at 30px, the fix is fewer/bigger circles, not a
     smaller silhouette. Single tone #cfc4ae — the ui-noose/ui-town
     count-icon family's bone — carried in-file, same swappable-art pattern
     as end-tentacle-*.svg: replace this file and the seat mark wears the
     new hand with zero code. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 280">
  <g fill="#cfc4ae">
    <!-- cuff: the wrist mass, hard against the palm -->
    <rect x="20" y="105" width="80" height="130" rx="26"/>
    <!-- palm: connects cuff, index root and the folded knuckles -->
    <rect x="70" y="78" width="130" height="140" rx="45"/>
    <!-- thumb: low and tucked along the fold, not upright -->
    <rect x="72" y="198" width="110" height="46" rx="23"
          transform="rotate(-6 127 221)"/>
    <!-- three folded fingers: a smooth receding knuckle curve under the index -->
    <circle cx="195" cy="185" r="50"/>
    <circle cx="262" cy="202" r="42"/>
    <circle cx="320" cy="214" r="33"/>
    <!-- index: one long extended finger, tapered root to tip -->
    <rect x="108" y="68" width="230" height="58" rx="29"/>
    <rect x="310" y="78" width="185" height="38" rx="19"/>
  </g>
</svg>
