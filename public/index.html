  <!-- Golem fork (2026-08-19, user call): THE LINK PREVIEW. What a pasted town
       link shows in a chat window. Every value below used to be upstream's —
       its title, its copy, its author, and an og:image and og:url pointing at
       bra1n.github.io, which meant every preview of OUR link fetched THEIR
       server and named THEIR site. All four now point here.

       NOTE, because it is the obvious next question: this is static HTML, so
       every town link previews identically. "Join <town>" in the card needs
       the server to inject per-URL meta before the page is served — real work,
       not a copy change. -->
  <!-- THE WORDS ARE THE USER'S (2026-08-19), and the per-town server route in
       the platform server must use the same three, with {Town Name} filled:

         site name   Blood on the Clocktower by The Pandemonium Institute
         title       Blood on the Clocktower: {Town Name}
         description Join {Town Name} for a game of Blood on the Clocktower,
                     presented by Golem Studios.

       This file is the NO-TOWN case, so the title drops the colon and the
       description drops the name. The site-name line credits the rights
       holder deliberately — we present the game, we do not claim it. -->
  <meta name="description" content="Join a game of Blood on the Clocktower, presented by Golem Studios.">
  <meta name="keywords" content="blood on the clocktower, town square, grimoire, storyteller, social deduction, online, golem studios">
  <meta name="robots" content="index, follow">
  <meta name="language" content="English">
  <meta name="author" content="Golem Studios">
  <meta property="og:site_name" content="Blood on the Clocktower by The Pandemonium Institute"/>
  <!-- the clocktower itself, cut to the 1200x630 every chat client renders at
       (see claude_temp_test/2026-08-19-og-card.mjs). 129KB on purpose: a card
       image is fetched by a crawler on someone else's timeout, and the 2.3MB
       source is a preview that sometimes simply does not appear. -->
  <meta property="og:image"
        content="https://botc.golem-studios.com/static/og-card.jpg"/>
  <meta property="og:image:width" content="1200"/>
  <meta property="og:image:height" content="630"/>
  <meta name="twitter:card" content="summary_large_image"/>
  <meta property="og:type" content="website"/>
  <meta property="og:description" content="Join a game of Blood on the Clocktower, presented by Golem Studios."/>
  <meta property="og:title" content="Blood on the Clocktower"/>
  <meta property="og:url" content="https://botc.golem-studios.com/"/>
